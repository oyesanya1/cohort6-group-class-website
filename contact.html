<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <h2><b>Contact Form</b></h2>
    <p>Send us a Message</p>
    <form action="" method="post">
        <label for="">Name</label><br>
        <input type="text" class="Form control" placeholder="Your Full Name" required /><br><br>
        <label for="">Phone Number</label><br>
        <input type="" class="Form control" placeholder="Enter Your Phone Number" required ><br><br>
        <label for="">Email Address</label><br>
        <input type="email" class="Form control" placeholder="Enter your valid email" required><br><br>
        <label for="">Upload Passport photo</label><br>
        <input type="file" name="" id=""><br><br>
        <label for="">Message:</label><br>
        <textarea placeholder="Explain your issues here.." class="Form control" style="columns: 20 ;" required></textarea><br>
        <button type="submit" class="Form Control">Submit</button>
        <button type="reset">Reset</button>

    </form>
</body>
</html>
