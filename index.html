<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaEdge Academy - Part 1</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    overflow-x:hidden;
}



header{
    position:fixed;
    width:100%;
    top:0;
    z-index:999;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
}

.navbar{
    width:90%;
    margin:auto;
    min-height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:2rem;
    font-weight:900;
}

.logo span{
    color:#00d4ff;
}

.nav-links{
    display:flex;
    gap:2rem;
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.nav-btn{
    background:#00d4ff;
    border:none;
    padding:12px 24px;
    border-radius:40px;
    cursor:pointer;
    font-weight:bold;
}



.hero{
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.5),
    rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1600&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:2rem;
}

.hero-content{
    max-width:800px;
    animation:fadeUp 1.3s ease;
}

.hero-content h1{
    font-size:clamp(3rem,6vw,6rem);
    margin-bottom:1rem;
}

.hero-content h1 span{
    color:#00d4ff;
}

.hero-content p{
    color:#d4d4d4;
    margin-bottom:2rem;
    font-size:1.2rem;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:1rem;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    padding:15px 28px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-weight:bold;
}

.primary-btn{
    background:#00d4ff;
}

.secondary-btn{
    background:transparent;
    border:1px solid white;
    color:white;
}

.primary-btn:hover,
.secondary-btn:hover{
    transform:translateY(-5px);
    transition:0.3s;
}



@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}



@media(max-width:900px){

    .navbar{
        flex-direction:column;
        gap:1rem;
        padding:1rem 0;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

}

</style>
</head>

<body>

<header>

<nav class="navbar">

<div class="logo">
Nova<span>Edge</span>
</div>

<ul class="nav-links">

<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Courses</a></li>
<li><a href="#">Contact</a></li>

</ul>

<button class="nav-btn">
Enroll Now
</button>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>
Learn The Skills
<span>Of The Future</span>
</h1>

<p>
NovaEdge Academy empowers future developers,
AI engineers and cybersecurity specialists.
</p>

<div class="hero-buttons">

<button class="primary-btn">
Start Learning
</button>

<button class="secondary-btn">
Explore Courses
</button>

</div>

</div>

</section>

</body>
</html>
